<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkLink</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF6B2B;
            --primary-dark: #e85a1a;
            --primary-light: #fff3ed;
            --green: #22c55e;
            --green-dark: #16a34a;
            --green-light: #f0fdf4;
            --red: #ef4444;
            --red-light: #fef2f2;
            --blue: #3b82f6;
            --blue-light: #eff6ff;
            --gray: #6b7280;
            --light: #f9fafb;
            --white: #ffffff;
            --border: #e5e7eb;
            --dark: #1e293b;
            --shadow: 0 4px 24px rgba(0,0,0,0.08);
            --radius: 14px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'DM Sans', sans-serif; background: #f1f5f9; min-height: 100vh; padding: 16px; }

        /* Screens */
        .screen { max-width: 480px; margin: 0 auto; display: none; }
        .screen.active { display: block; }

        /* Header */
        .app-header { text-align: center; padding: 24px 0 18px; }
        .app-logo { font-family: 'Sora', sans-serif; font-size: 26px; font-weight: 800; color: var(--primary); letter-spacing: -0.5px; }
        .app-logo span { color: var(--dark); }
        .app-tagline { font-size: 13px; color: var(--gray); margin-top: 3px; }

        /* Card */
        .card { background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow); padding: 22px; margin-bottom: 14px; }
        .card-title { font-family: 'Sora', sans-serif; font-size: 17px; font-weight: 700; color: var(--dark); margin-bottom: 18px; }

        /* Form */
        label { display: block; font-size: 11px; font-weight: 600; color: var(--gray); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 5px; margin-top: 13px; }
        label:first-of-type { margin-top: 0; }
        input, select { width: 100%; padding: 11px 13px; border: 1.5px solid var(--border); border-radius: 9px; font-family: 'DM Sans', sans-serif; font-size: 15px; color: var(--dark); background: var(--light); outline: none; transition: border-color 0.2s; }
        input:focus, select:focus { border-color: var(--primary); background: #fff; }

        /* Buttons */
        .btn { width: 100%; padding: 13px; border: none; border-radius: 10px; font-family: 'Sora', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer; transition: transform 0.15s; margin-top: 9px; letter-spacing: 0.2px; }
        .btn:active { transform: scale(0.97); }
        .btn-primary { background: var(--primary); color: white; }
        .btn-green { background: var(--green); color: white; }
        .btn-red { background: var(--red); color: white; }
        .btn-gray { background: #e5e7eb; color: #374151; }
        .btn-outline { background: transparent; border: 1.5px solid var(--border); color: var(--gray); }

        /* Home buttons */
        .home-btn { display: flex; align-items: center; gap: 15px; background: var(--white); border: none; border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px 20px; width: 100%; cursor: pointer; text-align: left; margin-bottom: 12px; transition: transform 0.15s, box-shadow 0.15s; }
        .home-btn:hover { box-shadow: 0 8px 28px rgba(0,0,0,0.13); transform: translateY(-1px); }
        .home-btn:active { transform: scale(0.98); }
        .home-btn-icon { width: 48px; height: 48px; border-radius: 13px; display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
        .icon-orange { background: var(--primary-light); }
        .icon-green { background: var(--green-light); }
        .icon-blue { background: var(--blue-light); }
        .icon-red { background: var(--red-light); }
        .home-btn-text h3 { font-family: 'Sora', sans-serif; font-size: 15px; font-weight: 700; color: var(--dark); }
        .home-btn-text p { font-size: 12px; color: var(--gray); margin-top: 2px; }

        /* Back row */
        .back-row { display: flex; align-items: center; gap: 7px; margin-bottom: 14px; cursor: pointer; color: var(--gray); font-size: 14px; font-weight: 500; max-width: 480px; margin-left: auto; margin-right: auto; }
        .back-row:hover { color: var(--primary); }

        /* Job card */
        .job-card { background: var(--white); border: 1.5px solid var(--border); border-radius: var(--radius); padding: 17px; margin-bottom: 12px; }
        .job-card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 11px; }
        .job-type { font-family: 'Sora', sans-serif; font-size: 16px; font-weight: 700; color: var(--dark); }
        .job-badge { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 20px; }
        .badge-orange { background: var(--primary-light); color: var(--primary); }
        .badge-green { background: var(--green-light); color: var(--green-dark); }
        .badge-gray { background: #f3f4f6; color: var(--gray); }
        .job-info { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
        .job-row { display: flex; align-items: center; gap: 7px; font-size: 13.5px; color: #374151; }
        .map-link { display: inline-flex; align-items: center; gap: 5px; color: var(--primary); font-size: 13px; font-weight: 600; text-decoration: none; padding: 6px 11px; background: var(--primary-light); border-radius: 8px; margin-bottom: 11px; }
        .slots-wrap { margin-bottom: 12px; }
        .slots-label { display: flex; justify-content: space-between; font-size: 11px; color: var(--gray); margin-bottom: 4px; }
        .slots-bar { height: 5px; background: #e5e7eb; border-radius: 3px; overflow: hidden; }
        .slots-fill { height: 100%; background: var(--green); border-radius: 3px; }

        /* Admin card */
        .admin-job-card { background: var(--white); border: 1.5px solid var(--border); border-radius: var(--radius); padding: 17px; margin-bottom: 12px; }
        .admin-job-card.pending { border-color: #fcd34d; background: #fffbeb; }
        .admin-job-card.approved { border-color: #86efac; }
        .admin-status { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 20px; margin-bottom: 10px; }
        .status-pending { background: #fef3c7; color: #92400e; }
        .status-approved { background: var(--green-light); color: var(--green-dark); }
        .admin-detail { font-size: 13px; color: #374151; margin-bottom: 4px; line-height: 1.5; }
        .admin-detail strong { color: var(--dark); }
        .admin-btn-row { display: flex; gap: 8px; margin-top: 12px; }
        .admin-btn-row .btn { margin-top: 0; flex: 1; padding: 10px; font-size: 13px; }

        /* Workers list */
        .workers-section { margin-top: 12px; border-top: 1px solid var(--border); padding-top: 12px; }
        .workers-title { font-size: 12px; font-weight: 600; color: var(--gray); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
        .worker-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; background: var(--light); border-radius: 8px; margin-bottom: 6px; }
        .worker-item-name { font-size: 13px; font-weight: 600; color: var(--dark); }
        .worker-item-phone { font-size: 12px; color: var(--gray); }
        .location-btn { font-size: 11px; font-weight: 700; padding: 5px 10px; background: var(--blue-light); color: var(--blue); border: none; border-radius: 7px; cursor: pointer; white-space: nowrap; }

        /* Notice */
        .notice { border-radius: 10px; padding: 13px 15px; font-size: 13px; line-height: 1.5; margin-bottom: 12px; }
        .notice-blue { background: var(--blue-light); color: #1e40af; border: 1.5px solid #bfdbfe; }
        .notice-orange { background: var(--primary-light); color: #9a3412; border: 1.5px solid #fed7aa; }

        /* Empty */
        .empty { text-align: center; padding: 36px 20px; color: var(--gray); }
        .empty .emoji { font-size: 38px; margin-bottom: 10px; }
        .empty p { font-size: 14px; }

        /* Loading */
        .loading { text-align: center; padding: 28px; color: var(--gray); font-size: 14px; }

        /* Login */
        .login-box { max-width: 340px; margin: 60px auto; }

        /* Modal */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100; align-items: flex-end; justify-content: center; }
        .modal-overlay.open { display: flex; }
        .modal-box { background: white; border-radius: 20px 20px 0 0; padding: 26px 22px 34px; width: 100%; max-width: 480px; animation: slideUp 0.22s ease; }
        @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .modal-title { font-family: 'Sora', sans-serif; font-size: 17px; font-weight: 700; color: var(--dark); margin-bottom: 16px; }

        /* Budget edit inline */
        .budget-edit-row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
        .budget-edit-row input { flex: 1; margin: 0; }
        .budget-edit-row button { width: auto; padding: 11px 16px; margin: 0; font-size: 13px; flex-shrink: 0; }

        /* Divider */
        .divider { height: 1px; background: var(--border); margin: 14px 0; }

        /* Tab bar */
        .tab-bar { display: flex; gap: 6px; margin-bottom: 14px; background: var(--white); border-radius: 10px; padding: 5px; box-shadow: var(--shadow); }
        .tab { flex: 1; padding: 9px; text-align: center; border: none; background: transparent; border-radius: 7px; font-family: 'Sora', sans-serif; font-size: 12px; font-weight: 600; color: var(--gray); cursor: pointer; transition: all 0.2s; }
        .tab.active { background: var(--primary); color: white; }
    </style>
</head>
<body>

<!-- ═══════════════ HOME ═══════════════ -->
<div class="screen active" id="screen-home">
    <div class="app-header">
        <div class="app-logo">Work<span>Link</span></div>
        <div class="app-tagline">Connecting workers & owners through admin</div>
    </div>
    <button class="home-btn" id="btn-go-owner">
        <div class="home-btn-icon icon-orange">📋</div>
        <div class="home-btn-text"><h3>Post a Work</h3><p>I need workers for my event</p></div>
    </button>
    <button class="home-btn" id="btn-go-worker">
        <div class="home-btn-icon icon-green">💼</div>
        <div class="home-btn-text"><h3>Find Work</h3><p>Browse available jobs near you</p></div>
    </button>

</div>

<!-- ═══════════════ OWNER PANEL ═══════════════ -->
<div class="screen" id="screen-owner">
    <div class="app-header"><div class="app-logo">Work<span>Link</span></div></div>
    <div class="back-row" id="owner-back">← Back</div>

    <!-- Post new work -->
    <div class="card">
        <div class="card-title">📋 Post New Work</div>
        <label>Your Name</label>
        <input type="text" id="owner-name" placeholder="Full name">
        <label>Your Phone Number</label>
        <input type="tel" id="owner-phone" placeholder="+91 XXXXX XXXXX">
        <label>Work Type</label>
        <select id="work-type">
            <option value="Catering">Catering</option>
            <option value="Cleaning">Cleaning</option>
            <option value="Decoration">Decoration</option>
            <option value="Others">Others</option>
        </select>
        <input type="text" id="other-text" placeholder="Describe your work" style="display:none; margin-top:8px;">
        <label>Workers Needed</label>
        <input type="number" id="needed-count" placeholder="e.g. 5" min="1">
        <label>Location (Google Maps Link)</label>
        <input type="url" id="work-location" placeholder="https://maps.google.com/...">
        <label>Total Budget (₹)</label>
        <input type="number" id="budget" placeholder="e.g. 5000" min="0">
        <button class="btn btn-primary" id="btn-post-work">Submit Work Request</button>
        <button class="btn btn-gray" id="btn-owner-cancel">Cancel</button>
    </div>

    <!-- My posts -->
    <div class="card">
        <div class="card-title">📁 My Posted Works</div>
        <div id="owner-posts-feed"><div class="loading">Loading...</div></div>
    </div>
</div>

<!-- ═══════════════ WORKER DASHBOARD ═══════════════ -->
<div class="screen" id="screen-worker">
    <div class="app-header"><div class="app-logo">Work<span>Link</span></div></div>
    <div class="back-row" id="worker-back">← Back</div>
    <div class="notice notice-blue">
        🔒 <strong>Admin mediated</strong> — Owner contact not shown. Admin connects you after confirmation.
    </div>
    <div id="job-feed"><div class="loading">⏳ Loading jobs...</div></div>
</div>



<!-- ═══════════════ WORKER CONFIRM MODAL ═══════════════ -->
<div class="modal-overlay" id="confirm-modal">
    <div class="modal-box">
        <div class="modal-title">✅ Confirm Your Interest</div>
        <label>Your Name</label>
        <input type="text" id="worker-name" placeholder="Full name">
        <label>Your Phone Number</label>
        <input type="tel" id="worker-phone" placeholder="+91 XXXXX XXXXX">
        <button class="btn btn-green" id="btn-submit-confirm" style="margin-top:14px;">Send to Admin</button>
        <button class="btn btn-gray" id="btn-close-modal">Cancel</button>
    </div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

<script>
// ── Check URL for admin access ────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
    if (window.location.search.includes('admin')) {
        document.getElementById('screen-home').classList.remove('active');
        document.getElementById('screen-admin-login').classList.add('active');
    }
});

// ── Owner session (phone stored during login) ──────────────
let ownerSessionPhone = null;

// ── Firebase init ──────────────────────────────────────────
firebase.initializeApp({
    apiKey: "AIzaSyA03zVPJ3InsB__d2cZHMpo_ktJoyrCXU",
    authDomain: "vinaywrites-a4f43.firebaseapp.com",
    projectId: "vinaywrites-a4f43",
    storageBucket: "vinaywrites-a4f43.appspot.com",
    messagingSenderId: "13814587804",
    appId: "1:13814587804:web:3c461c1a42bd6c6a0ae859"
});
const db = firebase.firestore();

let ADMIN_PASSWORD = "worklink@admin"; // default, overridden from Firestore
const BOT_TOKEN = "8781247032:AAFO15to4OwfwFUhFZGqoeLHt2mx7Z-j_dw";
const CHAT_ID    = "6674906122";

let currentJobId = null;
let currentTab   = 'pending';

// ── Load admin password from Firestore ────────────────────
(async () => {
    try {
        const doc = await db.collection("AppSettings").doc("admin").get();
        if (doc.exists && doc.data().password) {
            ADMIN_PASSWORD = doc.data().password;
        }
    } catch(e) {}
})();

// ── Telegram ───────────────────────────────────────────────
async function tg(msg) {
    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(msg)}`);
}

// ── Navigation ─────────────────────────────────────────────
function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    if (id === 'screen-worker') loadWorkerJobs();

    if (id === 'screen-owner')  loadOwnerPosts();
}

document.getElementById('btn-go-owner').addEventListener('click', () => showScreen('screen-owner'));
document.getElementById('btn-go-worker').addEventListener('click', () => {
    const phone = prompt("Enter your phone number to continue:");
    if (!phone || !phone.trim()) return;
    ownerSessionPhone = phone.trim();
    showScreen('screen-worker');
});

document.getElementById('owner-back').addEventListener('click', () => showScreen('screen-home'));
document.getElementById('worker-back').addEventListener('click', () => showScreen('screen-home'));
document.getElementById('admin-login-back').addEventListener('click', () => showScreen('screen-home'));
document.getElementById('admin-back').addEventListener('click', () => showScreen('screen-home'));
document.getElementById('btn-owner-cancel').addEventListener('click', () => showScreen('screen-home'));
document.getElementById('btn-close-modal').addEventListener('click', closeModal);
document.getElementById('btn-submit-confirm').addEventListener('click', submitConfirm);
document.getElementById('btn-post-work').addEventListener('click', postWork);

document.getElementById('work-type').addEventListener('change', function () {
    document.getElementById('other-text').style.display = this.value === 'Others' ? 'block' : 'none';
});

}


// ── Owner: Post Work ───────────────────────────────────────
async function postWork() {
    const name     = document.getElementById('owner-name').value.trim();
    const phone    = document.getElementById('owner-phone').value.trim();
    let   type     = document.getElementById('work-type').value;
    if (type === 'Others') type = document.getElementById('other-text').value.trim();
    const needed   = parseInt(document.getElementById('needed-count').value);
    const location = document.getElementById('work-location').value.trim();
    const budget   = parseInt(document.getElementById('budget').value);

    if (!name || !phone || !type || !needed || !budget) { alert("Please fill all fields."); return; }
    ownerSessionPhone = phone; // remember this owner's phone for this session

    const docRef = await db.collection("WorkRequests").add({
        OwnerName: name, OwnerPhone: phone, Type: type,
        Needed: needed, BookedBy: [], Location: location,
        Budget: budget, Status: "pending"   // hidden from workers until admin approves
    });

    await tg(
`📋 NEW WORK POSTED — Awaiting Approval
━━━━━━━━━━━━━━━
👤 Owner : ${name}
📞 Phone : ${phone}
🔧 Type  : ${type}
👷 Workers: ${needed}
💰 Budget: ₹${budget}
📍 ${location}
🆔 Job ID: ${docRef.id}
⚠️ Login to Admin Panel to Confirm or Cancel.`
    );

    alert("✅ Work posted! Admin will review and contact you shortly.");
    showScreen('screen-home');
    ['owner-name','owner-phone','needed-count','work-location','budget'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('work-type').value = 'Catering';
    document.getElementById('other-text').style.display = 'none';
}

// ── Owner: My Posts ────────────────────────────────────────
async function loadOwnerPosts() {
    const feed = document.getElementById('owner-posts-feed');
    feed.innerHTML = '<div class="loading">Loading...</div>';
    const snap = await db.collection("WorkRequests").get();
    let html = '';
    snap.forEach(d => {
        const data = d.data();
        const statusBadge = data.Status === 'approved'
            ? '<span class="job-badge badge-green">✅ Approved</span>'
            : '<span class="job-badge badge-gray">⏳ Pending</span>';
        html += `
        <div class="admin-job-card ${data.Status === 'pending' ? 'pending' : 'approved'}">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
                <span class="job-type">${data.Type}</span>${statusBadge}
            </div>
            <div class="admin-detail">👤 <strong>${data.OwnerName}</strong> · 📞 ${data.OwnerPhone}</div>
            <div class="admin-detail">👷 Workers: ${data.Needed} &nbsp;|&nbsp; 💰 Budget: ₹${data.Budget}</div>
            <div class="admin-detail">🆔 ${d.id}</div>
            <div class="divider"></div>
            <div style="font-size:12px;color:var(--gray);margin-bottom:6px;font-weight:600;">UPDATE BUDGET</div>
            <div class="budget-edit-row">
                <input type="number" id="budget-edit-${d.id}" placeholder="New budget ₹" value="${data.Budget}">
                <button class="btn btn-primary" onclick="updateBudget('${d.id}')">Update</button>
            </div>
        </div>`;
    });
    feed.innerHTML = html || '<div class="empty"><div class="emoji">📭</div><p>No posts yet.</p></div>';
}

async function updateBudget(jobId) {
    const newBudget = parseInt(document.getElementById(`budget-edit-${jobId}`).value);
    if (!newBudget || newBudget <= 0) { alert("Enter valid budget."); return; }
    await db.collection("WorkRequests").doc(jobId).update({ Budget: newBudget });
    alert("✅ Budget updated!");
    loadOwnerPosts();
}


// ── Worker: Load Jobs ──────────────────────────────────────
async function loadWorkerJobs() {
    const feed = document.getElementById('job-feed');
    feed.innerHTML = '<div class="loading">⏳ Loading jobs...</div>';
    const snap = await db.collection("WorkRequests").get();
    let html = '';

    snap.forEach(d => {
        const data = d.data();
        if (data.Status !== 'approved') return;  // only show approved jobs

        // If current user is the owner of this job, skip it
        if (ownerSessionPhone && data.OwnerPhone === ownerSessionPhone) return;

        const booked    = data.BookedBy ? data.BookedBy.length : 0;
        const remaining = data.Needed - booked;
        const perPerson = Math.floor((data.Budget * 0.9) / data.Needed);
        const fillPct   = Math.round((booked / data.Needed) * 100);

        if (remaining > 0) {
            html += `
            <div class="job-card">
                <div class="job-card-header">
                    <div class="job-type">${data.Type}</div>
                    <div class="job-badge badge-orange">₹${perPerson}/head</div>
                </div>
                <div class="job-info">
                    <div class="job-row">👷 <span>Slots: <strong>${remaining} remaining</strong> of ${data.Needed}</span></div>
                    <div class="job-row">💰 <span>Pay per person: <strong>₹${perPerson}</strong></span></div>
                </div>
                <div class="slots-wrap">
                    <div class="slots-label"><span>Slots filled</span><span>${booked}/${data.Needed}</span></div>
                    <div class="slots-bar"><div class="slots-fill" style="width:${fillPct}%"></div></div>
                </div>
                <a class="map-link" href="${data.Location}" target="_blank">📍 View Location</a>
                <button class="btn btn-green" onclick="openModal('${d.id}')">I'm Interested</button>
            </div>`;
        }
    });

    feed.innerHTML = html || '<div class="empty"><div class="emoji">🔍</div><p>No jobs available right now.<br>Check back soon!</p></div>';
}

// ── Worker: Confirm Modal ──────────────────────────────────
function openModal(jobId) {
    currentJobId = jobId;
    document.getElementById('worker-name').value = '';
    document.getElementById('worker-phone').value = '';
    document.getElementById('confirm-modal').classList.add('open');
}
function closeModal() {
    document.getElementById('confirm-modal').classList.remove('open');
    currentJobId = null;
}

async function submitConfirm() {
    const name  = document.getElementById('worker-name').value.trim();
    const phone = document.getElementById('worker-phone').value.trim();
    if (!name || !phone) { alert("Please enter your name and phone."); return; }
    if (!currentJobId) return;

    // Get GPS location
    let lat = null, lng = null;
    try {
        const pos = await new Promise((res, rej) => navigator.geolocation.getCurrentPosition(res, rej, {timeout:8000}));
        lat = pos.coords.latitude.toFixed(6);
        lng = pos.coords.longitude.toFixed(6);
    } catch(e) { /* location denied, that's ok */ }

    await db.collection("WorkRequests").doc(currentJobId).update({
        BookedBy: firebase.firestore.FieldValue.arrayUnion({ name, phone, lat, lng })
    });

    const locText = lat ? `📍 https://www.google.com/maps?q=${lat},${lng}` : '📍 Location not shared';
    await tg(
`💼 WORKER INTERESTED
━━━━━━━━━━━━━━━
👤 Name : ${name}
📞 Phone: ${phone}
${locText}
🆔 Job ID: ${currentJobId}`
