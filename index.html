<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Catering & Services App</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f7f6; padding: 20px; }
        .container { max-width: 500px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #1a73e8; }
        input, select, button { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button { background-color: #1a73e8; color: white; border: none; cursor: pointer; font-size: 16px; }
        .job-card { border: 1px solid #eee; padding: 15px; margin: 10px 0; border-radius: 8px; background: #fff; }
        .back-btn { background-color: gray; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container" id="main-menu">
    <h1>Welcome!</h1>
    <button onclick="showSection('owner-post')">Posting a Work</button>
    <button onclick="showSection('worker-reg')" style="background-color: #28a745;">Looking for Work</button>
</div>

<div class="container" id="owner-post" style="display:none;">
    <h2>Post New Work</h2>
    <input type="text" id="owner-name" placeholder="Owner Name" required>
    <input type="tel" id="owner-phone" placeholder="Phone Number" required>
    <select id="work-type">
        <option value="Catering">Catering</option>
        <option value="Cleaning">Cleaning</option>
        <option value="Decoration">Decoration</option>
    </select>
    <input type="url" id="work-location" placeholder="Paste Google Maps Link" required>
    <input type="number" id="budget" placeholder="Total Amount (₹)" required>
    <button onclick="postWork()">Submit Work</button>
    <button class="back-btn" onclick="showSection('main-menu')">Back</button>
</div>

<div class="container" id="worker-reg" style="display:none;">
    <h2>Worker Registration</h2>
    <input type="text" id="w-name" placeholder="Full Name" required>
    <input type="tel" id="w-phone" placeholder="Phone Number" required>
    <button onclick="registerWorker()" style="background-color: #28a745;">Register & View Jobs</button>
    <button class="back-btn" onclick="showSection('main-menu')">Back</button>
</div>

<div class="container" id="worker-dashboard" style="display:none;">
    <h2>Available Jobs</h2>
    <div id="job-feed"></div>
    <button class="back-btn" onclick="showSection('main-menu')">Back to Home</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyA03zVPJ3InsB__d2cZHMpo_ktJoyrCXU",
        authDomain: "vinaywrites-a4f43.firebaseapp.com",
        projectId: "vinaywrites-a4f43",
        storageBucket: "vinaywrites-a4f43.appspot.com",
        messagingSenderId: "13814587804",
        appId: "1:13814587804:web:3c461c1a42bd6c6a0ae859"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.showSection = (id) => {
        document.getElementById('main-menu').style.display = (id === 'main-menu') ? 'block' : 'none';
        document.getElementById('owner-post').style.display = (id === 'owner-post') ? 'block' : 'none';
        document.getElementById('worker-reg').style.display = (id === 'worker-reg') ? 'block' : 'none';
        document.getElementById('worker-dashboard').style.display = (id === 'worker-dashboard') ? 'block' : 'none';
        if(id === 'worker-dashboard') loadJobs();
    };

    window.postWork = async () => {
        const name = document.getElementById('owner-name').value;
        const loc = document.getElementById('work-location').value;
        const budget = document.getElementById('budget').value;
        if(!name || !loc || !budget) return alert("Please fill all fields!");
        
        await addDoc(collection(db, "WorkRequests"), {
            OwnerName: name, Type: document.getElementById('work-type').value,
            Location: loc, Budget: budget
        });
        alert("Work Posted Successfully!");
        showSection('main-menu');
    };

    window.registerWorker = () => { showSection('worker-dashboard'); };

    async function loadJobs() {
        const feed = document.getElementById('job-feed');
        const snapshot = await getDocs(collection(db, "WorkRequests"));
        feed.innerHTML = "";
        snapshot.forEach((doc) => {
            const d = doc.data();
            const earnings = d.Budget * 0.9;
            feed.innerHTML += `<div class="job-card">
                <h4>${d.Type}</h4>
                <p>Earnings: ₹${earnings}</p>
                <a href="${d.Location}" target="_blank">Open Google Maps</a><br>
                <button onclick="alert('Confirmed!')" style="background-color: #28a745; margin-top:10px;">Confirm Job</button>
            </div>`;
        });
    }
</script>
</body>
</html>
